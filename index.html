<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Utilería</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Registro de Usuario</h2>
        <form id="registroForm" novalidate>
            <label for="nombre">Nombre Completo (solo letras):</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Perez" required>
            
            <label for="fechaNac">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNac" required>
            
            <!-- Contenedor del error con la imagen del muñequito (Oculto por defecto) -->
            <div id="errorContainerRegistro" class="error-container" style="display: none;">
                <img src="img/para_error.jpg" alt="Error en registro" class="error-img">
                <div class="error-bubble" id="textoErrorRegistro">
                    ❌ Error: El nombre ingresado no es válido.
                </div>
            </div>

            <button type="submit">Calcular y Validar</button>
        </form>
        <p><a href="login.html">Ir al Login</a></p>
    </div>

    <!-- Estructura del Modal -->
    <div id="miModal" class="modal">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <h3>Resultado del Registro</h3>
            <p id="mensajeModal"></p>
        </div>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        const modal = document.getElementById("miModal");
        const spanCerrar = document.getElementsByClassName("cerrar")[0];
        const form = document.getElementById("registroForm");
        
        // Elementos para el error
        const nombreInput = document.getElementById("nombre");
        const errorContainerRegistro = document.getElementById("errorContainerRegistro");
        const textoErrorRegistro = document.getElementById("textoErrorRegistro");

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let nombre = nombreInput.value;
            const fechaNac = document.getElementById("fechaNac").value;
            
            // 1. Limpiar estados de error antes de volver a validar
            errorContainerRegistro.style.display = "none";
            nombreInput.classList.remove("input-error");
            
            // Uso de función libre para limpiar espacios extra
            nombre = limpiarEspacios(nombre);

            // 2. Validar nombre vacío o con números
            if (!nombre || !soloLetras(nombre)) {
                textoErrorRegistro.innerHTML = "❌ Error: El nombre solo debe contener letras (no números ni símbolos).";
                errorContainerRegistro.style.display = "flex"; // Muestra el muñequito
                nombreInput.classList.add("input-error");      // Pinta el borde rojo
                return; // Detiene la ejecución para que no salga el modal
            }

            // 3. Validar que la fecha no esté vacía
            if (!fechaNac) {
                textoErrorRegistro.innerHTML = "❌ Error: Por favor ingresa tu fecha de nacimiento.";
                errorContainerRegistro.style.display = "flex";
                return;
            }

            // Si todo está correcto, calcula la edad y muestra el modal
            const edad = calcularEdad(fechaNac);
            const esMayor = esMayorDeEdad(fechaNac);
            
            const mensaje = `Hola ${nombre}.<br>Tienes <strong>${edad} años</strong>.<br>` + 
                            (esMayor ? "Eres mayor de edad. Acceso permitido." : "Eres menor de edad. Acceso restringido.");
            
            document.getElementById("mensajeModal").innerHTML = mensaje;
            modal.style.display = "block";
        });

        // Cerrar el modal
        spanCerrar.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) modal.style.display = "none"; }
    </script>
</body>
</html>
