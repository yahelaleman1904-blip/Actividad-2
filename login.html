<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utilería</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <label>Correo Electrónico:</label>
            <input type="email" id="correo" required>
            
            <label>Contraseña:</label>
            <!-- Contenedor relativo para el ojo -->
            <div class="password-wrapper">
                <input type="password" id="password" required>
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>
            <small>Debe tener 8+ caracteres, mayúscula, minúscula, número y símbolo especial.</small>
            
            <!-- Contenedor del error con la imagen (Oculto por defecto) -->
            <div id="errorContainer" class="error-container" style="display: none;">
                <img src="img/para error.jpg" alt="Error de contraseña" class="error-img">
                <div class="error-bubble">
                    ❌ Error: La contraseña no cumple con *todos* los requisitos detallados. Revisa la ayuda a la izquierda.
                </div>
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <p id="mensajeLogin"></p>
        <p><a href="index.html">Volver al Registro</a></p>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        // Lógica para mostrar/ocultar contraseña
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Alterna el tipo de input entre 'password' y 'text'
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Cambia el ícono (opcional, aquí usamos un ojo cerrado cuando se ve el texto)
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Lógica de validación al enviar el formulario
        document.getElementById("loginForm").addEventListener('submit', function(e) {
            e.preventDefault();
            const correo = document.getElementById("correo").value;
            const password = passwordInput.value;
            const mensaje = document.getElementById("mensajeLogin");
            const errorContainer = document.getElementById("errorContainer");

            // Reiniciamos los mensajes y bordes rojos cada vez que intentan ingresar
            errorContainer.style.display = "none";
            passwordInput.classList.remove("input-error");
            mensaje.innerHTML = "";

            if (!validarCorreo(correo)) {
                mensaje.innerHTML = "❌ Formato de correo inválido.";
                mensaje.style.color = "red";
                return;
            }

            if (!validarPassword(password)) {
                // Si falla, mostramos el contenedor con la imagen y pintamos el borde rojo
                errorContainer.style.display = "flex";
                passwordInput.classList.add("input-error");
                return;
            }

            mensaje.innerHTML = "✅ Login exitoso. Validaciones superadas.";
            mensaje.style.color = "green";
        });
    </script>
</body>
</html>
