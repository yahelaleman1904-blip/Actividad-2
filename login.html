<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utilería</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" novalidate>
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com">
            <p id="errorCorreo" class="error-texto"></p>
            
            <label for="password">Contraseña:</label>
            <!-- Contenedor del campo con el ojo -->
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Tu contraseña">
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>
            <small>Debe tener 8+ caracteres, mayúscula, minúscula, número y símbolo especial.</small>
            
            <!-- Contenedor del error con la imagen del muñequito -->
            <div id="errorContainer" class="error-container" style="display: none;">
                <img src="img/para_error.jpg" alt="Error de contraseña" class="error-img">
                <div class="error-bubble">
                    ❌ Error: La contraseña no cumple con *todos* los requisitos detallados. Revisa la ayuda de arriba.
                </div>
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <p id="mensajeLogin"></p>
        <p><a href="index.html">Volver al Registro</a></p>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        // Mostrar / Ocultar contraseña
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Lógica al dar clic en Ingresar
        document.getElementById("loginForm").addEventListener('submit', function(e) {
            e.preventDefault();
            
            const correo = document.getElementById("correo").value;
            const password = passwordInput.value;
            const mensaje = document.getElementById("mensajeLogin");
            const errorCorreo = document.getElementById("errorCorreo");
            const errorContainer = document.getElementById("errorContainer");

            // Limpiar estados de error previos
            errorContainer.style.display = "none";
            errorCorreo.textContent = "";
            passwordInput.classList.remove("input-error");
            mensaje.innerHTML = "";

            let esValido = true;

            // 1. Validar correo
            if (!validarCorreo(correo)) {
                errorCorreo.textContent = "❌ Ingresa un correo electrónico válido.";
                esValido = false;
            }

            // 2. Validar contraseña (Muestra el muñequito si falla)
            if (!validarPassword(password)) {
                errorContainer.style.display = "flex"; // Despliega la imagen y el globo de error
                passwordInput.classList.add("input-error");
                esValido = false;
            }

            // Si ambas validaciones pasan
            if (esValido) {
                mensaje.innerHTML = "✅ Login exitoso. Validaciones superadas.";
                mensaje.style.color = "green";
            }
        });
    </script>
</body>
</html>
